name: CI

on:
  push:
    branches:
      - dev/v0.11.0-self-update
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run full test suite
        run: python -m pytest -q --basetemp .pytest-tmp

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .

      - name: Smoke test
        run: python -c "import beam_manager; import beam_manager.main; assert beam_manager.__version__ == '0.11.0'; print('Beam-MP-Server-Manager', beam_manager.__version__, 'OK')"

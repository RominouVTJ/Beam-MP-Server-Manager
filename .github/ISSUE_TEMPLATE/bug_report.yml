name: Bug report
description: Report a reproducible Beam-MP-Server-Manager problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Never paste BeamMP AuthKeys, passwords, appliance security codes, cookies, public IP addresses or other secrets.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: manager_version
    attributes:
      label: Beam-MP-Server-Manager version
      placeholder: e.g. 0.11.0
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - VMware Edition
        - Windows Edition
        - Development / source checkout
        - Other
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots or sanitized logs may be attached here.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked that this report contains no AuthKey, password, appliance security code, cookie or other secret.
          required: true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "Beam-MP-Server-Manager"
version = "0.10.0"
description = "Self-hosted BeamMP server administration console"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = [
    "argon2-cffi==25.1.0",
    "beautifulsoup4==4.13.4",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "packaging==25.0",
    "paramiko==3.5.1",
    "pillow==11.3.0",
    "pydantic-settings==2.10.1",
    "python-multipart==0.0.20",
    "qrcode==8.2",
    "tomlkit==0.13.3",
    "uvicorn==0.35.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-asyncio==1.1.0"]
windows = ["pystray==0.19.5"]

[project.scripts]
beam-manager = "beam_manager.cli:main"

[tool.setuptools.packages.find]
include = ["beam_manager*"]

[tool.setuptools.package-data]
beam_manager = [
    "frontend/*.html",
    "frontend/assets/*",
    "frontend/assets/map-thumbnails/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

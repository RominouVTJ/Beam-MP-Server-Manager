# The appliance owns tty1 directly. Keep any platform-specific kernel options,
# but prevent Plymouth from taking console ownership and suppress warning-level
# kernel messages from being copied to the interactive console.
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+${GRUB_CMDLINE_LINUX_DEFAULT} }plymouth.enable=0 loglevel=3"

<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" id="theme-color" content="#090d11">
  <title>Beam-MP-Server-Manager</title>
  <script>(()=>{try{const u=localStorage.getItem("beam-manager.last-user")||"anonymous",c=localStorage.getItem("beam-manager.theme."+u)||localStorage.getItem("beam-manager.theme.anonymous")||"system",d=matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.dataset.theme=c==="system"?(d?"dark":"light"):c;document.documentElement.dataset.themeChoice=c}catch{}})()</script>
  <link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/core.css"><script src="/assets/i18n.js" defer></script><script src="/assets/app.js" defer></script>
</head>
<body>
<div class="login-gate" id="login-gate" hidden><form class="login-card" id="login-form">
  <div class="brand"><div class="brand-mark"><span></span><span></span><span></span></div><div><strong>BEAM</strong><small>SERVER MANAGER</small></div></div>
  <p class="eyebrow accent" data-i18n="login.secure_access"></p><h1 data-i18n="login.title"></h1><p data-i18n="login.intro"></p>
  <label class="field"><span data-i18n="login.username"></span><input name="username" autocomplete="username" required></label>
  <label class="field"><span data-i18n="login.password"></span><input name="password" type="password" autocomplete="current-password" required></label>
  <label class="check-line"><input name="trust_device" type="checkbox"><span data-i18n="login.trust"></span></label><button class="primary-button" data-i18n="login.submit"></button><button class="text-link" id="show-recovery" type="button" data-i18n="recovery.open"></button><span class="form-error" id="login-error"></span>
  <div id="recovery-panel" hidden><hr><strong data-i18n="recovery.title"></strong><p class="human-help" data-i18n="recovery.help"></p><label class="field"><span data-i18n="login.username"></span><input id="recovery-username" autocomplete="username"></label><label class="field"><span data-i18n="security.code"></span><input id="recovery-code" type="password" autocomplete="off"></label><label class="field"><span data-i18n="recovery.new_password"></span><input id="recovery-password" type="password" minlength="12" maxlength="256"></label><label class="field"><span data-i18n="setup.confirm_password"></span><input id="recovery-confirmation" type="password" minlength="12" maxlength="256"></label><button class="secondary-button" id="recover-admin" type="button" data-i18n="recovery.reset"></button><span class="form-error" id="recovery-error"></span></div>
</form></div>
<div class="app-shell" id="app-shell">
<header class="topbar core-topbar">
  <div class="topbar-brand"><button id="menu-toggle" class="icon-button menu-toggle" type="button">☰</button><div class="brand"><div class="brand-mark"><span></span><span></span><span></span></div><div><strong>BEAM</strong><small>SERVER MANAGER</small></div></div></div>
  <div class="core-glance">
    <div class="status-pill" id="header-status" data-state="loading"><span class="pulse-dot"></span><strong id="header-status-label">—</strong></div>
    <div class="glance-metric"><small data-i18n="topbar.server"></small><strong id="topbar-server-name">—</strong></div><div class="glance-metric"><small data-i18n="topbar.players"></small><strong id="stat-live-players">—</strong></div><div class="glance-metric glance-map"><small data-i18n="topbar.map"></small><strong id="topbar-map">—</strong></div><div class="glance-metric"><small data-i18n="topbar.network"></small><strong id="topbar-network">—</strong></div>
  </div>
  <div class="persistent-actions"><button class="server-action start" data-service-action="start"><span>▶</span><b data-i18n="actions.start"></b></button><button class="server-action stop" data-service-action="stop"><span>■</span><b data-i18n="actions.stop"></b></button><button class="server-action restart" data-service-action="restart"><span>↻</span><b data-i18n="actions.restart"></b></button></div>
</header>
<aside class="sidebar" id="sidebar"><nav class="main-nav">
  <button class="nav-item active" data-page="dashboard"><span>⌂</span><b data-i18n="sidebar.dashboard"></b></button><button class="nav-item" data-page="live"><span>●</span><b data-i18n="sidebar.live"></b></button><button class="nav-item" data-page="maps"><span>◇</span><b data-i18n="sidebar.maps"></b></button><button class="nav-item" data-page="vehicles"><span>▰</span><b data-i18n="sidebar.vehicles"></b></button><button class="nav-item" data-page="mods"><span>⬡</span><b data-i18n="sidebar.mods"></b></button><button class="nav-item" data-page="backups"><span>▣</span><b data-i18n="sidebar.backups"></b></button><button class="nav-item" data-page="settings"><span>⚙</span><b data-i18n="sidebar.settings"></b></button>
</nav><div class="sidebar-foot"><span>v0.10.0</span><button id="logout" class="text-link" data-i18n="actions.logout"></button></div></aside><button class="drawer-scrim" id="drawer-scrim" hidden></button>
<main class="content">
<aside class="authkey-warning" id="authkey-warning" hidden><div><strong data-i18n="authkey.required_title"></strong><span data-i18n="authkey.required_help"></span></div><button class="primary-button" type="button" data-go-page="settings" data-i18n="authkey.configure"></button><a class="secondary-button" href="https://keymaster.beammp.com/login" target="_blank" rel="noopener noreferrer" data-i18n="authkey.open_keymaster"></a></aside>
<section class="page active" id="page-dashboard"><div class="page-title"><div><p class="eyebrow accent" data-i18n="dashboard.overview"></p><h1 data-i18n="dashboard.title"></h1></div></div>
  <div class="dashboard-core-grid"><article class="server-core-card"><p class="eyebrow" data-i18n="dashboard.server"></p><div class="big-server-state"><span id="dashboard-status-dot"></span><strong id="dashboard-status">—</strong></div><h2 id="dashboard-server-name">—</h2><dl class="core-facts"><div><dt data-i18n="dashboard.map"></dt><dd id="dashboard-map">—</dd></div><div><dt data-i18n="dashboard.players"></dt><dd id="dashboard-players">—</dd></div><div><dt data-i18n="dashboard.visibility"></dt><dd id="dashboard-visibility">—</dd></div></dl></article>
  <article class="connection-card"><p class="eyebrow accent" data-i18n="network.connection_title"></p><div class="connection-address"><div><small data-i18n="network.lan_address"></small><strong id="dashboard-lan">—</strong></div><button class="copy-button" data-copy-target="dashboard-lan" data-i18n="common.copy"></button></div><div class="connection-address"><div><small data-i18n="network.public_address"></small><strong id="dashboard-public">—</strong></div><button class="copy-button" data-copy-target="dashboard-public" data-i18n="common.copy"></button></div><div class="network-state-row"><span data-i18n="network.visibility"></span><strong id="network-visibility">—</strong></div><div class="network-state-row"><span data-i18n="network.accessibility"></span><strong id="network-reachability">—</strong></div><p class="human-help" id="network-help"></p></article></div>
  <article class="core-panel"><div class="panel-heading"><div><p class="eyebrow" data-i18n="dashboard.connected_now"></p><h2 data-i18n="dashboard.who_connected"></h2></div><button class="text-link" data-go-page="live" data-i18n="dashboard.open_live"></button></div><div class="player-grid" id="dashboard-player-cards"></div></article>
</section>
<section class="page" id="page-live"><div class="page-title"><div><p class="eyebrow accent" data-i18n="live.eyebrow"></p><h1 data-i18n="live.title"></h1></div><span class="status-pill" id="live-status">—</span></div><div class="live-layout"><article class="core-panel"><div class="panel-heading"><h2 data-i18n="players.connected"></h2><strong id="live-player-count">0</strong></div><div class="player-grid" id="live-player-cards"></div></article><article class="radar-panel"><div class="panel-heading"><h2 data-i18n="live.positions"></h2></div><div class="map-stage"><img id="minimap-image" alt="" hidden><canvas id="radar-canvas"></canvas></div><p class="human-help" id="live-map-help" data-i18n="live.position_help"></p></article></div></section>
<section class="page" id="page-maps"><div class="page-title"><div><p class="eyebrow accent" data-i18n="maps.eyebrow"></p><h1 data-i18n="maps.title"></h1></div></div><article class="active-content-card"><small data-i18n="maps.active"></small><strong id="active-map-name">—</strong></article><article class="core-panel"><div class="panel-heading"><h2 data-i18n="maps.installed"></h2><span id="maps-count">0</span></div><div class="content-grid" id="maps-grid"></div></article><article class="core-panel"><h2 data-i18n="maps.add"></h2><div class="local-import-zone" data-import-zone><strong data-i18n="imports.drop_zip"></strong><button class="secondary-button" data-import-pick data-accept-kind="map" data-i18n="imports.choose_files"></button></div></article></section>
<section class="page" id="page-vehicles"><div class="page-title"><div><p class="eyebrow accent" data-i18n="vehicles.eyebrow"></p><h1 data-i18n="vehicles.title"></h1></div></div><article class="core-panel"><div class="panel-heading"><h2 data-i18n="vehicles.installed"></h2><span id="vehicles-count">0</span></div><div class="content-grid" id="vehicles-grid"></div></article><article class="core-panel"><h2 data-i18n="vehicles.add"></h2><div class="local-import-zone" data-import-zone><strong data-i18n="imports.drop_zip"></strong><button class="secondary-button" data-import-pick data-accept-kind="vehicle" data-i18n="imports.choose_files"></button></div></article></section>
<section class="page" id="page-mods"><div class="page-title"><div><p class="eyebrow accent" data-i18n="mods.local_only"></p><h1 data-i18n="mods.title"></h1></div></div><article class="core-panel"><div class="panel-heading"><h2 data-i18n="mods.installed"></h2><span id="mods-count">0</span></div><div class="simple-table" id="mods-table"></div></article><article class="core-panel"><h2 data-i18n="mods.add"></h2><div class="local-import-zone" data-import-zone><strong data-i18n="imports.drop_zip"></strong><button class="secondary-button" data-import-pick data-accept-kind="any" data-i18n="imports.choose_files"></button></div></article></section>
<section class="page" id="page-backups"><div class="page-title"><div><p class="eyebrow accent" data-i18n="backups.protect"></p><h1 data-i18n="backups.title"></h1></div><button id="create-backup" class="primary-button" data-i18n="backups.create"></button></div><div class="content-grid" id="backups-grid"></div></section>
<section class="page" id="page-settings"><div class="page-title"><div><p class="eyebrow accent" data-i18n="settings.organized"></p><h1 data-i18n="settings.title"></h1></div></div><div class="settings-core">
  <details open><summary data-i18n="settings.general"></summary><div class="settings-block"><label class="field"><span data-i18n="settings.language"></span><select id="language-select"><option value="en">English</option><option value="fr">Français</option></select></label></div></details>
  <details open id="server-customization-settings"><summary data-i18n="settings.server"></summary><form id="server-settings-form" class="settings-block server-customizer">
    <div class="settings-card settings-card-wide"><div class="settings-card-title"><strong data-i18n="server_settings.identity"></strong><span data-i18n="server_settings.identity_help"></span></div><label class="field"><span data-i18n="server_settings.name"></span><input id="setting-server-name" maxlength="250"></label><label class="field"><span data-i18n="server_settings.description"></span><textarea id="setting-description" rows="3" maxlength="1000"></textarea></label><label class="field"><span data-i18n="server_settings.tags"></span><input id="setting-tags" maxlength="100" placeholder="Freeroam, Racing, Police"></label></div>
    <div class="settings-card"><div class="settings-card-title"><strong data-i18n="server_settings.capacity"></strong></div><label class="field"><span data-i18n="setup.max_players"></span><input id="setting-max-players" type="number" min="1" max="128"></label><label class="field"><span data-i18n="setup.max_cars"></span><input id="setting-max-cars" type="number" min="1" max="100"></label><div class="current-map-setting"><span data-i18n="server_settings.current_map"></span><strong id="setting-current-map">—</strong><button type="button" class="text-link" data-go-page="maps" data-i18n="server_settings.change_map"></button></div></div>
    <div class="settings-card"><div class="settings-card-title"><strong data-i18n="server_settings.access"></strong></div><label class="switch-line"><input id="setting-public-listing" type="checkbox"><span><b data-i18n="server_settings.public_listing"></b><small data-i18n="server_settings.public_listing_help"></small></span></label><label class="switch-line"><input id="setting-allow-guests" type="checkbox"><span><b data-i18n="server_settings.allow_guests"></b><small data-i18n="server_settings.allow_guests_help"></small></span></label><label class="switch-line"><input id="setting-log-chat" type="checkbox"><span><b data-i18n="server_settings.log_chat"></b><small data-i18n="server_settings.log_chat_help"></small></span></label><label class="switch-line"><input id="setting-information-packet" type="checkbox"><span><b data-i18n="server_settings.information_packet"></b><small data-i18n="server_settings.information_packet_help"></small></span></label></div>
    <div class="settings-card settings-card-wide"><div class="settings-card-title"><strong data-i18n="server_settings.advanced"></strong><span data-i18n="server_settings.advanced_help"></span></div><div class="settings-grid"><label class="field"><span data-i18n="server_settings.port"></span><input id="setting-port" type="number" min="1" max="65535"></label><label class="field"><span data-i18n="server_settings.bind_ip"></span><input id="setting-bind-ip" maxlength="128"></label><label class="field"><span data-i18n="server_settings.resource_folder"></span><input id="setting-resource-folder" maxlength="128"></label><label class="switch-line"><input id="setting-debug" type="checkbox"><span><b data-i18n="server_settings.debug"></b><small data-i18n="server_settings.debug_help"></small></span></label></div></div>
    <div class="settings-save-bar"><span data-i18n="server_settings.restart_note"></span><button class="primary-button" data-i18n="common.save"></button></div>
  </form></details>
  <details open id="beammp-security-settings"><summary data-i18n="settings.beammp"></summary><div class="settings-block">
    <div class="network-state-row"><span data-i18n="authkey.status"></span><strong id="authkey-status">—</strong></div>
    <p class="human-help" data-i18n="authkey.never_displayed"></p>
    <form id="authkey-form" class="settings-grid"><label class="field"><span>AuthKey</span><input id="authkey-value" type="password" minlength="8" maxlength="512" autocomplete="off" required></label><label class="field"><span data-i18n="security.code"></span><input id="authkey-security-code" type="password" maxlength="24" autocomplete="off" required></label><button class="primary-button" data-i18n="authkey.save"></button></form>
    <a class="secondary-link" href="https://keymaster.beammp.com/login" target="_blank" rel="noopener noreferrer" data-i18n="authkey.open_keymaster"></a>
  </div></details>
  <details id="user-management-settings"><summary data-i18n="settings.users"></summary><div class="settings-block">
    <p class="human-help" data-i18n="users.password_policy"></p>
    <label class="field"><span data-i18n="security.code_for_changes"></span><input id="users-security-code" type="password" maxlength="24" autocomplete="off"></label>
    <form id="create-user-form" class="settings-grid"><label class="field"><span data-i18n="login.username"></span><input id="new-user-name" minlength="3" maxlength="64" required></label><label class="field"><span data-i18n="login.password"></span><input id="new-user-password" type="password" minlength="12" maxlength="256" required></label><label class="field"><span data-i18n="setup.confirm_password"></span><input id="new-user-confirmation" type="password" minlength="12" maxlength="256" required></label><label class="field"><span data-i18n="users.role"></span><select id="new-user-role"><option value="viewer" data-i18n="users.viewer"></option><option value="admin" data-i18n="users.admin"></option></select></label><button class="primary-button" data-i18n="users.create"></button></form>
    <div class="simple-table" id="users-table"></div>
  </div></details>
  <details open id="network-test-settings"><summary data-i18n="settings.network"></summary><div class="settings-block network-test-card"><dl class="core-facts"><div><dt data-i18n="network.lan_address"></dt><dd id="settings-lan">—</dd></div><div><dt data-i18n="network.public_ip"></dt><dd id="settings-public">—</dd></div><div><dt data-i18n="network.accessibility"></dt><dd id="settings-reachability">—</dd></div></dl><div class="connectivity-actions"><button id="test-connectivity" type="button" class="primary-button" data-i18n="network.test_connection"></button><a class="secondary-button" href="https://docs.beammp.com/server/create-a-server/#7-how-to-check-the-connectivity-of-your-beamp-server" target="_blank" rel="noopener noreferrer" data-i18n="network.open_official_checker"></a></div><div class="connectivity-result"><span data-i18n="network.public_endpoint"></span><strong id="connectivity-public-endpoint">—</strong><p id="connectivity-result" data-i18n="network.test_not_run"></p></div><p class="human-help" data-i18n="network.test_help"></p></div></details>
  <details><summary data-i18n="settings.appearance"></summary><div class="settings-block"><fieldset class="theme-choices"><legend data-i18n="theme.title"></legend><button type="button" data-theme-choice="system" aria-pressed="false" data-i18n="theme.system"></button><button type="button" data-theme-choice="light" aria-pressed="false" data-i18n="theme.light"></button><button type="button" data-theme-choice="dark" aria-pressed="false" data-i18n="theme.dark"></button></fieldset></div></details>
  <details><summary data-i18n="settings.backups"></summary><div class="settings-block"><p data-i18n="settings.backup_help"></p><button class="secondary-button" data-go-page="backups" data-i18n="settings.open_backups"></button></div></details>
  <details><summary data-i18n="settings.update"></summary><div class="settings-block"><dl class="core-facts"><div><dt data-i18n="settings.installed_version"></dt><dd id="installed-beammp-version">—</dd></div><div><dt data-i18n="settings.latest_version"></dt><dd id="latest-beammp-version">—</dd></div></dl><button id="check-update" class="secondary-button" data-i18n="settings.check_update"></button></div></details>
  <details id="advanced-settings"><summary data-i18n="settings.advanced"></summary><div class="settings-block advanced-grid"><article><div class="panel-heading"><h3 data-i18n="settings.logs"></h3><button id="refresh-logs" class="text-link" data-i18n="common.refresh"></button></div><pre id="manager-logs"></pre></article><article><div class="panel-heading"><h3 data-i18n="settings.diagnostic"></h3><button id="refresh-diagnostic" class="text-link" data-i18n="common.refresh"></button></div><pre id="diagnostic-output"></pre></article><article><h3 data-i18n="settings.version"></h3><strong>Beam-MP-Server-Manager v0.10.0</strong></article></div></details>
</div></section>
</main></div>
<section class="import-panel" id="import-panel" hidden><div class="panel-heading"><div><p class="eyebrow accent" data-i18n="imports.title"></p><strong id="import-summary">0 / 0</strong></div><button id="clear-completed" class="text-link" data-i18n="imports.clear_completed"></button></div><div id="import-list"></div></section><input id="import-file-input" type="file" accept=".zip,application/zip" multiple hidden>
<aside class="pending-bar" id="pending-bar" hidden><span data-i18n="pending.restart_required"></span><button id="apply-restart" class="primary-button" data-i18n="pending.restart_now"></button></aside><div class="toast-stack" id="toast-stack" aria-live="polite"></div>
</body></html>
